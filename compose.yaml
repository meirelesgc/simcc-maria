# Interface web do chatbot: docker compose up -d --build
#   página em http://localhost:8001 (ou http://<ip-da-máquina>:8001)
# Lê DATABASE_URL, OPENAI_API_KEY e WEB_PASSWORD do .env (veja docs/chatbot/web.md).
services:
  maria-web:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}  # só para o log de auditoria
    image: simcc-maria-web
    restart: unless-stopped
    env_file: .env
    environment:
      # o Postgres é o serviço "db" da stack simcc-back, alcançado pela rede dela;
      # usuário, senha e banco continuam vindo do DATABASE_URL do .env
      DATABASE_HOST: ${DATABASE_HOST:-db:5432}
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8001
    ports:
      - "${WEB_PORT:-8001}:8001"
    networks:
      - simcc
    volumes:
      - ./logs:/app/logs                  # auditoria e custo: um JSONL por sessão
      - ./data/raw:/app/data/raw:ro       # só para o hash dos dados no log

  # Scripts sem Python na máquina (ingest, load-db, maria, evaluate, pytest, mkdocs):
  #   bin/run ingest · bin/run load-db · bin/run maria · bin/run pytest
  # Monta o repositório inteiro: mudanças no código valem sem rebuild e os
  # arquivos gerados (data/processed, logs) ficam na máquina.
  tools:
    profiles: [tools]  # não sobe com "docker compose up"
    build:
      context: .
      args:
        POETRY_GROUPS: dev,docs
    image: simcc-maria-tools
    env_file: .env
    environment:
      DATABASE_HOST: ${DATABASE_HOST:-db:5432}
      GIT_COMMIT: ${GIT_COMMIT:-}
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:8000"  # mkdocs serve; só publicada com "run --service-ports"
    stdin_open: true
    tty: true
    networks:
      - simcc
    command: bash

networks:
  simcc:
    external: true
    name: ${SIMCC_NETWORK:-simcc_default}
